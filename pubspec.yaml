name: daylight
description: "A clock that runs in daylight local time"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.1.0+0

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  location: ^8.0.0
  flutter_analog_clock: ^1.0.3
  cupertino_icons: ^1.0.6
  firebase_core: ^4.11.0
  package_info_plus: ^10.2.0
  shared_preferences: ^2.2.0
  web: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any
  flutter_lints: ^6.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/css/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#9300ff"
    theme_color: "#ff00f4"
